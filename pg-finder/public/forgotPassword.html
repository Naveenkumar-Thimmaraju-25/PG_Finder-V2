<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password - PG Finder</title>
  <link rel="icon" href="images/pglogo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-nav"></div>

  <main class="auth-wrap">
    <div class="auth-card">
      <span class="tag">Account recovery</span>
      <h1>Forgot password?</h1>
      <p class="sub">No worries, we'll send you reset instructions.</p>

      <form id="forgotForm" novalidate>
        <div class="field">
          <label for="email">Enter your email</label>
          <input id="email" name="email" type="email" autocomplete="email" required placeholder="Enter email">
        </div>
        <button class="btn btn-gold btn-block" type="submit">Send reset link</button>
      </form>

      <p class="auth-foot">Don't remember your email? <a href="otherWays.html">Try other methods</a></p>
      <p class="auth-foot" style="margin-top:8px">Remember your password? <a href="login.html">Login here</a></p>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
