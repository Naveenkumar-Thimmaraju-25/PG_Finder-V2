<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact us - PG Finder</title>
  <link rel="icon" href="images/pglogo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-nav"></div>

  <div class="page-head">
    <div class="container">
      <h1>Get in touch</h1>
      <p>Need help finding a PG? Send us a message.</p>
    </div>
  </div>

  <section class="section">
    <div class="container contact-grid">
      <div class="info-card">
        <span class="tag" style="color:var(--gold)">Contact us</span>
        <h2>We'd love to hear from you</h2>
        <p>Questions about a listing, your account or listing your own PG? Reach out any time.</p>
        <div class="info-item"><div class="ico">📞</div><a href="tel:+919042943853">+91 9042943853</a></div>
        <div class="info-item"><div class="ico">📧</div><a href="mailto:krishna1109@gmail.com">krishna1109@gmail.com</a></div>
        <div class="info-item"><div class="ico">📍</div><span>Bangalore, Karnataka</span></div>
      </div>

      <div class="form-card">
        <form id="contactForm" novalidate>
          <div class="field"><label for="name">Your name</label><input id="name" name="name" required maxlength="100" placeholder="Your name"></div>
          <div class="field"><label for="email">Your email</label><input id="email" name="email" type="email" required placeholder="you@example.com"></div>
          <div class="field"><label for="message">Message</label><textarea id="message" name="message" required minlength="10" maxlength="2000" placeholder="Write your message"></textarea></div>
          <button class="btn btn-gold btn-block" type="submit">Send message</button>
        </form>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="js/app.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
