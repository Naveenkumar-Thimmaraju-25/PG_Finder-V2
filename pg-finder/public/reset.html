<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set a new password - PG Finder</title>
  <link rel="icon" href="images/pglogo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-nav"></div>

  <main class="auth-wrap">
    <div class="auth-card">
      <span class="tag">Almost done</span>
      <h1>New password</h1>
      <p class="sub">Choose a password you haven't used before.</p>

      <form id="resetForm" novalidate>
        <div class="field">
          <label for="password">New password</label>
          <div class="pw">
            <input id="password" name="password" type="password" autocomplete="new-password" required placeholder="8+ chars, letter &amp; number">
            <button type="button" data-toggle-pw="password" aria-label="Show or hide password">👁</button>
          </div>
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required placeholder="Repeat password">
        </div>
        <button class="btn btn-gold btn-block" type="submit">Update password</button>
      </form>

      <p class="auth-foot">Back to <a href="login.html">Login</a></p>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
